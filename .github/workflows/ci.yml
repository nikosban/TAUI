name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Required quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0
          cache: pnpm

      - name: Install from frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Verify registry signatures
        shell: bash
        run: |
          set +e
          pnpm audit signatures
          signature_status=$?
          set -e

          if [ "$signature_status" -eq 0 ]; then
            exit 0
          fi

          if curl --fail --silent --show-error --retry 2 \
            https://registry.npmjs.org/-/npm/v1/keys > /dev/null; then
            exit "$signature_status"
          fi

          echo "::warning::npm registry keys endpoint unavailable; signature verification deferred"

      # Shipped dependencies are held to every published advisory; build/test
      # tooling fails the gate at high severity because it is never distributed.
      - name: Audit production dependencies (low+)
        run: pnpm audit:prod

      - name: Audit development dependencies (high+)
        run: pnpm audit:dev

      - name: Build
        run: pnpm build

      - name: Run unit and component tests
        run: pnpm test

      - name: Install Playwright Chromium
        run: pnpm --filter @tui-designer/app exec playwright install chromium --with-deps --only-shell

      - name: Run browser smoke tests
        id: browser-tests
        run: pnpm test:e2e

      - name: Upload browser failure artifacts
        if: failure() && steps.browser-tests.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-failure-${{ github.run_id }}
          path: |
            packages/app/playwright-report/
            packages/app/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Enforce core and app coverage
        run: pnpm test:coverage

      - name: Typecheck
        run: pnpm typecheck

      - name: Check formatting and lint rules
        run: pnpm check

      - name: Check architecture and unused code
        run: |
          pnpm check:arch
          pnpm check:unused

      - name: Check generated files are current
        id: generated-files
        run: pnpm check:generated

      - name: Upload regenerated file on failure
        if: failure() && steps.generated-files.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stale-generated-file-${{ github.run_id }}
          path: packages/core/src/ops/box-table.ts
          if-no-files-found: error
          retention-days: 7

      - name: Validate published core package
        run: |
          pnpm --filter @tui-designer/core test:packed
          pnpm --filter @tui-designer/core lint:pkg
          pnpm --filter @tui-designer/core check:bundle
