name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          version: 11.19.0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0
          cache: pnpm

      - name: Install from frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Verify registry signatures
        shell: bash
        run: |
          set +e
          pnpm audit signatures
          signature_status=$?
          set -e

          if [ "$signature_status" -eq 0 ]; then
            exit 0
          fi

          if curl --fail --silent --show-error --retry 2 \
            https://registry.npmjs.org/-/npm/v1/keys > /dev/null; then
            exit "$signature_status"
          fi

          echo "::warning::npm registry keys endpoint unavailable; signature verification deferred"

      - name: Audit dependencies
        run: pnpm audit --audit-level=low --ignore-registry-errors

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Install Playwright Chromium
        run: pnpm --filter @tui-designer/app exec playwright install chromium --with-deps --only-shell

      - name: Run browser smoke tests
        run: pnpm test:e2e

      - name: Enforce core coverage
        run: pnpm test:coverage

      - name: Typecheck
        run: pnpm typecheck

      - name: Check formatting and lint rules
        run: pnpm check

      - name: Check architecture and unused code
        run: |
          pnpm --filter @tui-designer/app check:arch
          pnpm --filter @tui-designer/app check:unused
          pnpm --filter @tui-designer/core check:arch
          pnpm --filter @tui-designer/core check:unused

      - name: Validate published core package
        run: |
          pnpm --filter @tui-designer/core test:packed
          pnpm --filter @tui-designer/core lint:pkg
          pnpm --filter @tui-designer/core check:bundle
